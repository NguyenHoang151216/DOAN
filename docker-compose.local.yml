services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hotel-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: hotel-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hotel-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DoAnHotelParkingDb;User Id=sa;Password=Your_password123;Encrypt=False;TrustServerCertificate=True;"
      JwtSettings__Issuer: "DoAn.HotelParking"
      JwtSettings__Audience: "DoAn.HotelParking.Client"
      JwtSettings__SecretKey: "DoAn.HotelParking.Super.Secret.Key.2026"
      JwtSettings__AccessTokenExpirationMinutes: "60"
      Minio__Endpoint: "minio:9000"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__BucketName: "hotel-images"
      Minio__UseSsl: "false"
      Minio__PublicBaseUrl: "http://localhost:9000"
      Minio__AutoCreateBucket: "true"
      Minio__SetBucketPublicRead: "true"
      Firebase__CredentialsPath: "firebase/firebase-adminsdk.json"
      Firebase__ProjectId: "helo-945c8"
    ports:
      - "5146:8080"
    volumes:
      - ./firebase:/app/firebase
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ./Flutter_App-main
      dockerfile: Dockerfile
      args:
        API_BASE_URL: "http://localhost:5146"
    container_name: hotel-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
  minio-data:
